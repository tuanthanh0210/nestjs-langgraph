services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-8}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      STORE_NAME: ${STORE_NAME:-NestShop}
      STORE_HOTLINE: ${STORE_HOTLINE:-0900 000 000}
      STORE_EMAIL: ${STORE_EMAIL:-hello@nestshop.vn}
      STORE_ADDRESS: ${STORE_ADDRESS:-123 Nguyễn Trãi, Quận 1, TP.HCM}
      SHIPPING_FEE: ${SHIPPING_FEE:-30000}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-500000}
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
    volumes:
      - ./data/products.csv:/app/data/products.csv:ro
      - ./data/store-info.md:/app/data/store-info.md:ro
      - orders:/app/data/orders
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  orders:
