name: Registry Probe

# Temporary diagnostic. Shows what a GitHub-hosted runner receives from the
# Semgrep registry and which counting method reads it correctly. Holds no
# secrets, checks out nothing, and is never merged.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Same fetch as PR Security, then inspect each file
        run: |
          mkdir -p "$RUNNER_TEMP/sast-rules"
          env | grep -i -E 'proxy|curl' || echo "no proxy/curl env"
          ls -la ~/.curlrc 2>/dev/null || echo "no ~/.curlrc"
          for spec in typescript:50 javascript:50 nodejs:20 expressjs:40 owasp-top-ten:300 github-actions:8 dockerfile:5; do
            pack="${spec%%:*}"; min="${spec##*:}"; file="$RUNNER_TEMP/sast-rules/${pack}.yml"
            curl --fail --silent --show-error --max-time 60 --retry 3 --output "$file" "https://semgrep.dev/c/p/${pack}"
            count="$(grep -c -E '^- id:' "$file" || true)"
            echo "${pack}: ${count} rules (minimum ${min})"
            echo "    bytes=$(wc -c < "$file") lines=$(wc -l < "$file") sha=$(sha256sum "$file" | cut -c1-12) yq-rules=$(yq '.rules | length' "$file" 2>&1 | head -1)"
            echo "    indented-id=$(grep -c -E '^ +- id:' "$file" || true) json-id=$(grep -o '"id":' "$file" | wc -l) any-id=$(grep -c -E 'id:' "$file" || true)"
            echo "    head: $(head -c 160 "$file" | tr '\n' '~')"
          done

      - name: Same URL again without --fail
        run: |
          f="$RUNNER_TEMP/typescript-again.yml"
          meta="$(curl --silent --show-error --max-time 60 --retry 3 --output "$f" --write-out '%{http_code} %{content_type} %{size_download}' "https://semgrep.dev/c/p/typescript")"
          echo "typescript again: ${meta} dash-id=$(grep -c -E '^- id:' "$f" || true) sha=$(sha256sum "$f" | cut -c1-12)"
          echo "    head: $(head -c 160 "$f" | tr '\n' '~')"
