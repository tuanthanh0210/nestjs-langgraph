name: PR Security

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- runs the default-branch copy so a PR cannot edit or disable these checks; PR code is only read as data, never built, installed or executed
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions: {}

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  SEMGREP_IMAGE: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b

jobs:
  sast:
    name: sast-semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted scanner config (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/security

      - name: Check out PR head as data (never built or executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Pull Semgrep image (digest-pinned)
        run: docker pull --quiet "$SEMGREP_IMAGE"

      - name: Fetch Semgrep registry rulesets
        run: |
          mkdir -p "$RUNNER_TEMP/sast-rules"
          for pack in typescript javascript nodejs expressjs owasp-top-ten github-actions dockerfile; do
            curl --fail --silent --show-error --max-time 60 --retry 3 \
              --output "$RUNNER_TEMP/sast-rules/${pack}.yml" "https://semgrep.dev/c/p/${pack}"
          done
          sha256sum "$RUNNER_TEMP"/sast-rules/*.yml

      - name: Strip PR-supplied scanner config and symlinks
        run: bash trusted/.github/security/prepare-pr-tree.sh pr trusted/.github/security/semgrepignore

      - name: Semgrep SAST (full PR tree, offline container)
        env:
          SEMGREP_EXCLUDE_PATHS: /.github/workflows/pr-security.yml
        run: bash trusted/.github/security/run-semgrep.sh pr "$RUNNER_TEMP/sast-rules"

  malware-rules:
    name: malware-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted rules (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/security

      - name: Check out PR head as data (never built or executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Protected paths, symlinks and submodules
        env:
          PR_DIR: pr
          PROTECTED_PATTERNS: trusted/.github/security/protected-paths.txt
        run: |
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${token}"
          set +e
          bash trusted/.github/security/check-protected-paths.sh
          rc=$?
          echo "::${token}::"
          exit "$rc"

      - name: Pull Semgrep image (digest-pinned)
        if: ${{ !cancelled() }}
        run: docker pull --quiet "$SEMGREP_IMAGE"

      - name: Strip PR-supplied scanner config and symlinks
        if: ${{ !cancelled() }}
        run: bash trusted/.github/security/prepare-pr-tree.sh pr trusted/.github/security/semgrepignore

      - name: Custom malware rules (env exfiltration, shell execution, CI backdoors, obfuscation)
        if: ${{ !cancelled() }}
        run: bash trusted/.github/security/run-semgrep.sh pr trusted/.github/security/semgrep-malware.yml

  secrets:
    name: secrets-gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted config (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/security

      - name: Check out PR head with history as data (never built or executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Install gitleaks (checksum-pinned)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Strip PR-supplied scanner config and symlinks
        run: bash trusted/.github/security/prepare-pr-tree.sh pr

      - name: Gitleaks (PR commits and PR tree)
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          GITLEAKS_CONFIG_FILE: trusted/.github/security/gitleaks.toml
          PR_DIR: pr
        run: bash trusted/.github/security/run-gitleaks.sh

  dependencies:
    name: dependencies-osv
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted config (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/security

      - name: Check out PR head as data (never built or executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Install osv-scanner (checksum-pinned)
        run: |
          bin="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --max-time 120 --output "$bin" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${bin}" | sha256sum --check --strict
          chmod +x "$bin"

      - name: Strip PR-supplied scanner config and symlinks
        run: bash trusted/.github/security/prepare-pr-tree.sh pr

      - name: OSV scan of every lockfile in the PR (no install, no scripts)
        run: |
          token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${token}"
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source \
            --config trusted/.github/security/osv-scanner.toml \
            --recursive --no-ignore --no-resolve \
            pr
          rc=$?
          echo "::${token}::"
          exit "$rc"

  claude-review:
    name: claude-security-review
    needs: [sast, malware-rules, secrets, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'pr-security-internal' || 'pr-security-external' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted review script (default branch only, no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false
          sparse-checkout: .github/security

      - name: Fetch the exact reviewed diff as data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --header "Accept: application/vnd.github.diff" \
            "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/pr.diff"
          echo "Diff bytes: $(wc -c < "$RUNNER_TEMP/pr.diff")"

      - name: Claude security review (no tools, structured output, bounded)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
          DIFF_FILE: ${{ runner.temp }}/pr.diff
          PROMPT_FILE: trusted/.github/security/claude-review-prompt.md
          SCHEMA_FILE: trusted/.github/security/claude-review-schema.json
          MAX_DIFF_BYTES: "262144"
        run: bash trusted/.github/security/claude-review.sh

  security-gate:
    name: security-gate
    if: ${{ !cancelled() }}
    needs: [sast, malware-rules, secrets, dependencies, claude-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every stage must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          if ! jq -e 'length == 5 and (to_entries | all(.value.result == "success"))' <<<"$RESULTS" > /dev/null; then
            echo "::error title=PR Security::At least one stage failed, was skipped or was cancelled. Merge is blocked."
            exit 1
          fi
          echo "All automated stages passed. A maintainer approval is still required to merge."
